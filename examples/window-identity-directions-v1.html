<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizum Glass · Window identity directions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f0f0f0;
        --glass: rgba(255, 255, 255, 0.62);
        --glass-strong: rgba(255, 255, 255, 0.82);
        --glass-soft: rgba(255, 255, 255, 0.35);
        --surface-muted: rgba(244, 244, 245, 0.72);
        --line: rgba(228, 228, 231, 0.78);
        --ink: #18181b;
        --ink-soft: #3f3f46;
        --ink-muted: #71717a;
        --caption: #a1a1aa;
        --teal: #2dd4bf;
        --violet: #a78bfa;
        --rose: #fb7185;
        --yellow: #fbbf24;
        --ease-spring: cubic-bezier(.22, 1, .36, 1);
        --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", system-ui, sans-serif;
        --font-title: "New York", "New York Extra Large", "Noto Serif SC", "Songti SC", Georgia, serif;
      }

      * { box-sizing: border-box; }
      html, body, #root { width: 100%; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        color: var(--ink-soft);
        background:
          radial-gradient(ellipse at 20% 30%, rgba(167,139,250,.08) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 70%, rgba(129,230,217,.06) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 50%, rgba(251,191,36,.04) 0%, transparent 60%),
          var(--canvas);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; }
      button:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--teal) 58%, transparent);
        outline-offset: 2px;
      }

      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 30px 92px;
      }
      .prototype-view {
        width: min(1220px, 100%);
        animation: view-enter 420ms var(--ease-spring) both;
      }
      .pair-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
        align-items: start;
      }
      .platform-sample { min-width: 0; }
      .platform-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 9px 12px;
        color: var(--ink-muted);
        font: 600 11.5px/1.2 var(--font-title);
      }
      .platform-label::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: var(--violet);
        box-shadow: 0 0 0 3px rgba(167,139,250,.1);
      }
      .platform-sample:last-child .platform-label::before {
        background: var(--teal);
        box-shadow: 0 0 0 3px rgba(45,212,191,.1);
      }

      .app-window {
        container-type: inline-size;
        width: 100%;
        height: 598px;
        overflow: hidden;
        position: relative;
        isolation: isolate;
        border: 1px solid rgba(255,255,255,.54);
        background: var(--glass);
        box-shadow:
          0 1px 0 rgba(255,255,255,.62) inset,
          0 24px 70px rgba(0,0,0,.11);
        backdrop-filter: blur(40px) saturate(200%);
        -webkit-backdrop-filter: blur(40px) saturate(200%);
      }
      .app-window[data-platform="macos"] { border-radius: 12px; }
      .app-window[data-platform="windows"] { border-radius: 8px; }
      .app-window::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        border-radius: inherit;
        box-shadow: 0 1px 0 rgba(255,255,255,.3) inset;
      }

      .native-chrome {
        position: relative;
        height: 42px;
        flex: 0 0 42px;
        display: flex;
        align-items: center;
        user-select: none;
        border-bottom: 1px solid rgba(228,228,231,.42);
      }
      .native-chrome.blank { border-bottom-color: transparent; }
      .mac-lights {
        position: absolute;
        inset-inline-start: 14px;
        top: 0;
        height: 42px;
        display: flex;
        align-items: center;
        gap: 8px;
        pointer-events: none;
      }
      .mac-lights i {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        box-shadow: 0 0 0 1px rgba(0,0,0,.09) inset;
      }
      .mac-lights i:nth-child(1) { background: #ff5f57; }
      .mac-lights i:nth-child(2) { background: #febc2e; }
      .mac-lights i:nth-child(3) { background: #28c840; }
      .win-caption {
        position: absolute;
        inset-inline-end: 0;
        top: 0;
        height: 42px;
        display: grid;
        grid-template-columns: repeat(3, 46px);
        color: #62626a;
        pointer-events: none;
      }
      .win-caption span { display: grid; place-items: center; }
      .win-caption svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 1.1; }
      .native-title {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--ink-soft);
        font-size: 12px;
        line-height: 1;
      }
      [data-platform="windows"] .native-title {
        max-width: calc(100% - 170px);
        margin-inline-start: 14px;
      }
      .native-title.task-name {
        font: 600 15.5px/1 var(--font-title);
        color: var(--ink);
      }
      [data-platform="macos"] .native-title.centered {
        position: absolute;
        left: 50%;
        max-width: calc(100% - 220px);
        transform: translateX(-50%);
        text-align: center;
      }
      .chrome-action {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 7px;
        color: var(--ink-muted);
        background: transparent;
        cursor: pointer;
        transition: transform 180ms var(--ease-spring), background 150ms ease, color 150ms ease;
      }
      .chrome-action:hover { color: var(--ink-soft); background: rgba(255,255,255,.48); transform: translateY(-1px); }
      .chrome-action:active { transform: scale(.96); }
      .chrome-action svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .mac-leading-tools {
        position: absolute;
        inset-inline-start: 78px;
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .eyebrow {
        color: var(--ink-muted);
        font: 600 11.5px/1.35 var(--font-title);
      }
      .page-title {
        margin: 4px 0 3px;
        color: var(--ink);
        font: 700 19px/1.25 var(--font-title);
      }
      .lede { margin: 0; color: var(--ink-muted); font-size: 11.5px; line-height: 1.55; }
      .separator { height: 1px; margin: 0 8px; background: var(--line); opacity: .55; }
      .dot {
        width: 5px;
        height: 5px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: var(--teal);
        box-shadow: 0 0 0 3px rgba(45,212,191,.1);
      }
      .soft-button {
        height: 30px;
        padding: 6px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--glass-strong);
        color: var(--ink-soft);
        box-shadow: 0 1px 2px rgba(0,0,0,.02);
        font-size: 12px;
        font-weight: 400;
        cursor: pointer;
        transition: transform 180ms var(--ease-spring), box-shadow 180ms ease, border-color 180ms ease;
      }
      .soft-button:hover { transform: translateY(-1px); border-color: #d4d4d8; box-shadow: 0 3px 8px rgba(0,0,0,.04); }
      .soft-button:active { transform: scale(.97); }

      /* Direction 1: Task Plaque */
      .task-plaque-window { display: flex; flex-direction: column; }
      .task-plaque-window[data-platform="windows"] .native-chrome { background: rgba(255,255,255,.16); }
      .windows-toolstrip {
        height: 38px;
        padding: 4px 16px;
        display: flex;
        align-items: center;
        gap: 3px;
        border-bottom: 1px solid rgba(228,228,231,.42);
      }
      .task-shell { flex: 1; min-height: 0; display: flex; }
      .task-drawer {
        width: 0;
        overflow: hidden;
        flex: 0 0 auto;
        background: rgba(255,255,255,.18);
        border-inline-end: 1px solid transparent;
        opacity: 0;
        transform: translateX(-8px);
        transition: width 240ms var(--ease-spring), opacity 160ms ease, transform 240ms var(--ease-spring), border-color 180ms ease;
      }
      .task-shell[data-drawer="open"] .task-drawer {
        width: 148px;
        opacity: 1;
        transform: translateX(0);
        border-inline-end-color: rgba(228,228,231,.48);
      }
      .task-drawer-inner { width: 148px; padding: 19px 10px; }
      .nav-label { margin: 0 8px 8px; color: var(--caption); font: 600 10px/1.2 var(--font-title); }
      .nav-item {
        width: 100%;
        padding: 7px 9px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--ink-muted);
        text-align: left;
        font-size: 11.5px;
      }
      .nav-item.active { background: rgba(255,255,255,.5); color: var(--ink); }
      .task-main { flex: 1; min-width: 0; padding: 26px 24px 22px; }
      .task-status { display: flex; align-items: center; gap: 9px; margin-bottom: 21px; }
      .task-status span:last-child { color: var(--ink-muted); font-size: 11px; }
      .transcript {
        display: grid;
        gap: 15px;
        margin-top: 21px;
      }
      .quote-row { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: start; }
      .quote-time { padding-top: 2px; color: var(--caption); font-size: 10.5px; font-variant-numeric: tabular-nums; }
      .quote-copy { margin: 0; color: var(--ink-soft); font-size: 12.5px; line-height: 1.62; }
      .task-actions { display: flex; gap: 8px; margin-top: 22px; }

      /* Direction 2: Workspace Compass */
      .workspace-window { display: flex; flex-direction: column; }
      .workspace-shell { flex: 1; min-height: 0; display: flex; }
      .workspace-sidebar {
        width: 168px;
        flex: 0 0 auto;
        overflow: hidden;
        background: rgba(255,255,255,.22);
        border-inline-end: 1px solid rgba(228,228,231,.54);
        transition: width 250ms var(--ease-spring), opacity 180ms ease;
      }
      .workspace-shell[data-sidebar="closed"] .workspace-sidebar { width: 0; opacity: 0; }
      .workspace-sidebar-inner { width: 168px; padding: 18px 12px; }
      .workspace-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 4px 16px 8px;
      }
      .workspace-heading strong { color: var(--ink); font: 600 13.5px/1.2 var(--font-title); }
      .workspace-nav { display: grid; gap: 3px; }
      .workspace-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .page-header { padding: 20px 24px 17px; }
      .header-controls { display: flex; align-items: center; gap: 4px; margin-left: -6px; margin-bottom: 11px; }
      .workspace-content { padding: 20px 24px; }
      .note-list { display: grid; gap: 8px; }
      .note-row {
        display: grid;
        grid-template-columns: 1fr max-content;
        gap: 14px;
        align-items: center;
        padding: 10px 11px;
        border-radius: 10px;
        background: rgba(255,255,255,.2);
        box-shadow: 0 1px 0 rgba(255,255,255,.28) inset, 0 5px 14px rgba(0,0,0,.018);
        cursor: pointer;
        transition: transform 180ms var(--ease-spring), background 180ms ease;
      }
      .note-row:hover { transform: translateY(-1px); background: rgba(255,255,255,.35); }
      .note-row strong { display: block; color: var(--ink-soft); font-size: 12.5px; font-weight: 500; }
      .note-row small { display: block; margin-top: 3px; color: var(--caption); font-size: 10.5px; }
      .note-row time { color: var(--caption); font-size: 10.5px; }

      /* Direction 3: Nameless Canvas */
      .canvas-window { display: flex; flex-direction: column; }
      .canvas-window .native-chrome { height: 38px; flex-basis: 38px; }
      .canvas-window .mac-lights { height: 38px; }
      .canvas-window .win-caption { height: 38px; }
      .canvas-space {
        flex: 1;
        min-height: 0;
        position: relative;
        padding: 14px 24px 24px;
      }
      .canvas-rail { position: absolute; top: 13px; left: 14px; display: grid; gap: 4px; }
      .panel-cluster {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(176px, .65fr);
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 14px;
        padding-left: 32px;
      }
      .utility-panel {
        min-width: 0;
        border: 1px solid rgba(255,255,255,.46);
        border-radius: 16px;
        background: rgba(255,255,255,.38);
        box-shadow: 0 1px 0 rgba(255,255,255,.48) inset, 0 14px 34px rgba(0,0,0,.045);
        backdrop-filter: blur(28px) saturate(180%);
        transition: transform 190ms var(--ease-spring), box-shadow 190ms ease, background 190ms ease;
      }
      .utility-panel[data-active="true"] { transform: translateY(-1px); background: rgba(255,255,255,.48); box-shadow: 0 1px 0 rgba(255,255,255,.55) inset, 0 18px 38px rgba(0,0,0,.065); }
      .utility-panel.primary { grid-row: 1 / span 2; padding: 22px; }
      .utility-panel.side { padding: 18px; }
      .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .panel-heading .page-title { margin-top: 0; }
      .panel-body { margin-top: 18px; }
      .mini-metric { display: grid; gap: 7px; margin-bottom: 17px; }
      .mini-metric-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--ink-muted); font-size: 11px; }
      .metric-track { height: 2px; overflow: hidden; border-radius: 999px; background: var(--line); }
      .metric-fill { height: 100%; width: 68%; background: var(--teal); opacity: .72; }
      .clip-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
      .clip-row + .clip-row { border-top: 1px solid rgba(228,228,231,.5); }
      .clip-row strong { color: var(--ink-soft); font-size: 11.5px; font-weight: 500; }
      .clip-row small { color: var(--caption); font-size: 10px; }
      .side-copy { margin: 13px 0 0; color: var(--ink-muted); font-size: 11.5px; line-height: 1.55; }

      @container (max-width: 500px) {
        .workspace-sidebar { width: 0; opacity: 0; }
        .workspace-sidebar-inner { display: none; }
        .task-shell[data-drawer="open"] .task-drawer { width: 126px; }
        .task-drawer-inner { width: 126px; }
        .panel-cluster { grid-template-columns: 1fr; padding-left: 30px; }
        .utility-panel.primary { grid-row: auto; }
        .utility-panel.side:last-child { display: none; }
        [data-platform="macos"] .native-title.centered { max-width: 155px; text-align: left; left: 124px; transform: none; }
      }

      @media (max-width: 980px) {
        .pair-grid { grid-template-columns: 1fr; }
        .prototype-view { width: min(600px, 100%); }
      }
      @media (max-width: 620px) {
        .stage { padding: 18px 12px 86px; }
        .app-window { height: 570px; }
        .win-caption { grid-template-columns: repeat(3, 42px); }
      }
      @keyframes view-enter {
        from { opacity: 0; transform: translateY(7px) scale(.995); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.82);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      .proto-picker-highlight {
        position: absolute;
        top: 4px;
        left: 0;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        will-change: transform;
      }

      /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
      .proto-picker[data-ready] .proto-picker-highlight {
        transition:
          transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
          width 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
      }

      .proto-picker-item {
        position: relative; /* sits above the highlight */
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        font: inherit;
        cursor: pointer;
        transition: color 150ms ease-out;
      }

      .proto-picker-item:hover {
        color: rgba(255, 255, 255, 0.85);
      }

      .proto-picker-item:active {
        transform: scale(0.97);
      }

      .proto-picker-item:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.4);
        outline-offset: 2px;
      }

      .proto-picker-item[data-active] {
        color: #fff;
      }

      .proto-picker-divider {
        width: 1px;
        height: 16px;
        margin: 0 4px;
        background: rgba(255, 255, 255, 0.12);
      }

      .proto-picker-replay {
        padding: 0 10px;
        font-size: 14px;
      }

      .proto-picker[data-position="top"] {
        bottom: auto;
        top: 24px;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useEffect, useLayoutEffect, useRef, useState } from "react";
      import { createRoot } from "react-dom/client";

      const h = React.createElement;

      function Icon({ name }) {
        const common = { viewBox: "0 0 16 16", "aria-hidden": true };
        if (name === "sidebar") return h("svg", common,
          h("rect", { x: 2.3, y: 2.6, width: 11.4, height: 10.8, rx: 2 }),
          h("path", { d: "M5.6 2.9v10.2" })
        );
        if (name === "back") return h("svg", common,
          h("path", { d: "m9.8 3.3-4.6 4.7 4.6 4.7" })
        );
        if (name === "more") return h("svg", common,
          h("path", { d: "M3.2 8h.1M7.95 8h.1M12.7 8h.1", strokeWidth: 2.3 })
        );
        return h("svg", common, h("circle", { cx: 8, cy: 8, r: 5.5 }));
      }

      function MacLights() {
        return h("div", { className: "mac-lights", "aria-label": "macOS 原生窗口控制区（位置示意）" }, h("i"), h("i"), h("i"));
      }

      function WinCaption() {
        return h("div", { className: "win-caption", "aria-label": "Windows 原生窗口控制区（位置示意）" },
          h("span", null, h("svg", { viewBox: "0 0 10 10" }, h("path", { d: "M1 7.5h8" }))),
          h("span", null, h("svg", { viewBox: "0 0 10 10" }, h("rect", { x: 1.5, y: 1.5, width: 7, height: 7 }))),
          h("span", null, h("svg", { viewBox: "0 0 10 10" }, h("path", { d: "m2 2 6 6M8 2 2 8" })))
        );
      }

      function ChromeAction({ icon, label, onClick }) {
        return h("button", { className: "chrome-action", type: "button", "aria-label": label, onClick }, h(Icon, { name: icon }));
      }

      function NativeChrome({ platform, title, taskTitle = false, blank = false, onSidebar }) {
        return h("header", { className: `native-chrome${blank ? " blank" : ""}` },
          platform === "macos" && h(MacLights),
          platform === "macos" && onSidebar && h("div", { className: "mac-leading-tools" },
            h(ChromeAction, { icon: "sidebar", label: "展开或收起侧栏", onClick: onSidebar })
          ),
          title && h("div", { className: `native-title${taskTitle ? " task-name" : ""}${platform === "macos" ? " centered" : ""}` }, title),
          platform === "windows" && h(WinCaption)
        );
      }

      const transcriptRows = [
        ["02:14", "The useful part is not the archive itself, but how quickly a thought becomes findable again."],
        ["04:08", "Keep the summary close to the source. Distance turns a working note into another inbox."],
        ["07:31", "A small interface can still hold a large context if each layer has one clear job."]
      ];

      function TaskPlaque({ platform }) {
        const [drawerOpen, setDrawerOpen] = useState(false);
        const toggle = () => setDrawerOpen(v => !v);
        return h("section", { className: "app-window task-plaque-window", "data-platform": platform },
          h(NativeChrome, {
            platform,
            title: "Morning interview",
            taskTitle: true,
            onSidebar: platform === "macos" ? toggle : null
          }),
          platform === "windows" && h("div", { className: "windows-toolstrip" },
            h(ChromeAction, { icon: "sidebar", label: "展开或收起侧栏", onClick: toggle }),
            h(ChromeAction, { icon: "back", label: "返回" })
          ),
          h("div", { className: "task-shell", "data-drawer": drawerOpen ? "open" : "closed" },
            h("aside", { className: "task-drawer", "aria-hidden": !drawerOpen },
              h("div", { className: "task-drawer-inner" },
                h("div", { className: "nav-label" }, "Recent tasks"),
                h("button", { className: "nav-item active", type: "button" }, "Morning interview"),
                h("button", { className: "nav-item", type: "button" }, "Field notes"),
                h("button", { className: "nav-item", type: "button" }, "Reading list")
              )
            ),
            h("main", { className: "task-main" },
              h("div", { className: "task-status" }, h("span", { className: "dot" }), h("span", null, "Transcript · saved just now")),
              h("div", { className: "eyebrow" }, "Key passages"),
              h("div", { className: "transcript" }, transcriptRows.map(([time, copy]) =>
                h("div", { className: "quote-row", key: time },
                  h("time", { className: "quote-time" }, time),
                  h("p", { className: "quote-copy" }, copy)
                )
              )),
              h("div", { className: "task-actions" },
                h("button", { className: "soft-button", type: "button" }, "Add note"),
                h("button", { className: "soft-button", type: "button" }, "Share")
              )
            )
          )
        );
      }

      const workspaceItems = ["Today", "Interviews", "Reading", "Archive"];
      const noteRows = [
        ["The small-interface principle", "Transcript", "09:18"],
        ["Search should feel local", "Reading note", "Yesterday"],
        ["Window identity study", "Draft", "Mon"]
      ];

      function WorkspaceCompass({ platform }) {
        const [sidebarOpen, setSidebarOpen] = useState(true);
        const toggle = () => setSidebarOpen(v => !v);
        return h("section", { className: "app-window workspace-window", "data-platform": platform },
          h(NativeChrome, {
            platform,
            title: platform === "windows" ? "Research Desk" : null,
            blank: platform === "macos"
          }),
          h("div", { className: "workspace-shell", "data-sidebar": sidebarOpen ? "open" : "closed" },
            h("aside", { className: "workspace-sidebar" },
              h("div", { className: "workspace-sidebar-inner" },
                h("div", { className: "workspace-heading" },
                  h("strong", null, "Research Desk"),
                  h(ChromeAction, { icon: "sidebar", label: "收起侧栏", onClick: toggle })
                ),
                h("nav", { className: "workspace-nav", "aria-label": "Workspace" }, workspaceItems.map((item, index) =>
                  h("button", { className: `nav-item${index === 1 ? " active" : ""}`, type: "button", key: item }, item)
                ))
              )
            ),
            h("main", { className: "workspace-main" },
              h("header", { className: "page-header" },
                h("div", { className: "header-controls" },
                  !sidebarOpen && h(ChromeAction, { icon: "sidebar", label: "展开侧栏", onClick: toggle }),
                  h(ChromeAction, { icon: "back", label: "返回" })
                ),
                h("div", { className: "eyebrow" }, "Interviews"),
                h("h1", { className: "page-title" }, "Morning interview"),
                h("p", { className: "lede" }, "Three passages are ready to review.")
              ),
              h("div", { className: "separator" }),
              h("div", { className: "workspace-content" },
                h("div", { className: "note-list" }, noteRows.map(([title, kind, time], index) =>
                  h("div", { className: "note-row", role: "button", tabIndex: 0, key: title },
                    h("div", null, h("strong", null, title), h("small", null, kind)),
                    h("time", null, time),
                    index === -1 && h("span")
                  )
                )),
                h("div", { className: "task-actions" },
                  h("button", { className: "soft-button", type: "button" }, "New note"),
                  h("button", { className: "soft-button", type: "button" }, "Dismiss")
                )
              )
            )
          )
        );
      }

      function CanvasPanel({ className = "", active, onClick, children }) {
        return h("section", {
          className: `utility-panel ${className}`,
          "data-active": active,
          onClick,
          tabIndex: 0
        }, children);
      }

      function NamelessCanvas({ platform }) {
        const [active, setActive] = useState("outline");
        return h("section", { className: "app-window canvas-window", "data-platform": platform },
          h(NativeChrome, { platform, blank: true }),
          h("main", { className: "canvas-space" },
            h("div", { className: "canvas-rail" }, h(ChromeAction, { icon: "sidebar", label: "打开面板切换器" })),
            h("div", { className: "panel-cluster" },
              h(CanvasPanel, { className: "primary", active: active === "outline", onClick: () => setActive("outline") },
                h("div", { className: "panel-heading" },
                  h("div", null,
                    h("h1", { className: "page-title" }, "Interview outline"),
                    h("p", { className: "lede" }, "Notes grouped by recurring idea")
                  ),
                  h(ChromeAction, { icon: "more", label: "更多选项" })
                ),
                h("div", { className: "panel-body" },
                  h("div", { className: "mini-metric" },
                    h("div", { className: "mini-metric-row" }, h("span", null, "Review progress"), h("span", null, "68%")),
                    h("div", { className: "metric-track" }, h("div", { className: "metric-fill" }))
                  ),
                  [["Quiet defaults", "3 passages"], ["Local context", "5 passages"], ["Window shape", "2 passages"]].map(([title, count]) =>
                    h("div", { className: "clip-row", key: title }, h("strong", null, title), h("small", null, count))
                  ),
                  h("div", { className: "task-actions" }, h("button", { className: "soft-button", type: "button" }, "Open notes"))
                )
              ),
              h(CanvasPanel, { className: "side", active: active === "sources", onClick: () => setActive("sources") },
                h("div", { className: "eyebrow" }, "Sources"),
                h("h2", { className: "page-title" }, "Three linked files"),
                h("p", { className: "side-copy" }, "Transcript, recording and one reading note are kept beside this outline.")
              ),
              h(CanvasPanel, { className: "side", active: active === "status", onClick: () => setActive("status") },
                h("div", { className: "task-status", style: { marginBottom: 10 } }, h("span", { className: "dot" }), h("span", null, "Local index ready")),
                h("p", { className: "side-copy" }, "All changes are saved on this device.")
              )
            )
          )
        );
      }

      const variants = [
        { name: "Task Plaque", component: TaskPlaque },
        { name: "Workspace Compass", component: WorkspaceCompass },
        { name: "Nameless Canvas", component: NamelessCanvas }
      ];

      function DirectionPair({ component: Component }) {
        return h("div", { className: "prototype-view" },
          h("div", { className: "pair-grid" },
            h("div", { className: "platform-sample" },
              h("div", { className: "platform-label" }, "macOS"),
              h(Component, { platform: "macos" })
            ),
            h("div", { className: "platform-sample" },
              h("div", { className: "platform-label" }, "Windows"),
              h(Component, { platform: "windows" })
            )
          )
        );
      }

      function Picker({ current, onSelect, onReplay }) {
        const pickerRef = useRef(null);
        const itemRefs = useRef([]);
        const highlightRef = useRef(null);

        const moveHighlight = () => {
          const el = itemRefs.current[current];
          const highlight = highlightRef.current;
          if (!el || !highlight) return;
          highlight.style.width = `${el.offsetWidth}px`;
          highlight.style.transform = `translateX(${el.offsetLeft}px)`;
        };

        useLayoutEffect(moveHighlight, [current]);
        useEffect(() => {
          const onResize = () => moveHighlight();
          window.addEventListener("resize", onResize);
          requestAnimationFrame(() => requestAnimationFrame(() => pickerRef.current?.setAttribute("data-ready", "")));
          return () => window.removeEventListener("resize", onResize);
        }, []);

        return h("nav", { className: "proto-picker", "aria-label": "Prototype variants", ref: pickerRef },
          h("span", { className: "proto-picker-highlight", "aria-hidden": true, ref: highlightRef }),
          variants.map((variant, index) => h("button", {
            className: "proto-picker-item",
            "data-active": index === current ? "" : undefined,
            "aria-current": index === current ? "true" : undefined,
            ref: el => itemRefs.current[index] = el,
            onClick: () => onSelect(index),
            key: variant.name
          }, variant.name)),
          h("span", { className: "proto-picker-divider", "aria-hidden": true }),
          h("button", { className: "proto-picker-item proto-picker-replay", "aria-label": "Replay animation (R)", onClick: onReplay }, "↻")
        );
      }

      function App() {
        const query = new URLSearchParams(location.search);
        const initial = Math.max(0, Math.min(variants.length - 1, (parseInt(query.get("v"), 10) || 1) - 1));
        const [current, setCurrent] = useState(initial);
        const [nonce, setNonce] = useState(0);

        const select = index => {
          if (index < 0 || index >= variants.length) return;
          setCurrent(index);
          setNonce(value => value + 1);
          const url = new URL(location);
          url.searchParams.set("v", index + 1);
          history.replaceState(null, "", url);
        };
        const replay = () => setNonce(value => value + 1);

        useEffect(() => {
          const onKeyDown = event => {
            if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable) return;
            if (event.metaKey || event.ctrlKey || event.altKey) return;
            const num = parseInt(event.key, 10);
            if (num >= 1 && num <= variants.length) select(num - 1);
            else if (event.key === "ArrowRight") select((current + 1) % variants.length);
            else if (event.key === "ArrowLeft") select((current - 1 + variants.length) % variants.length);
            else if (event.key === "r" || event.key === "R") replay();
          };
          document.addEventListener("keydown", onKeyDown);
          return () => document.removeEventListener("keydown", onKeyDown);
        }, [current]);

        const Component = variants[current].component;
        return h(React.Fragment, null,
          h("main", { className: "stage", id: "stage" }, h(DirectionPair, { component: Component, key: `${current}-${nonce}` })),
          h(Picker, { current, onSelect: select, onReplay: replay })
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
