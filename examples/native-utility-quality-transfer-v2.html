<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Cleanup Motion Transfer Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #efeff1;
        --panel: rgba(250, 250, 251, 0.9);
        --field: rgba(255, 255, 255, 0.86);
        --field-muted: rgba(241, 241, 243, 0.84);
        --line: rgba(63, 63, 70, 0.1);
        --ink: #202024;
        --ink-soft: #55555e;
        --muted: #888892;
        --quiet: #aaaab3;
        --teal: #2dd4bf;
        --rose: #fb7185;
        --violet: #a78bfa;
        --ease: cubic-bezier(.23, 1, .32, 1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #111113;
          --panel: rgba(36, 36, 40, 0.92);
          --field: rgba(49, 49, 54, 0.88);
          --field-muted: rgba(42, 42, 47, 0.92);
          --line: rgba(255, 255, 255, 0.09);
          --ink: #f1f1f3;
          --ink-soft: #d0d0d5;
          --muted: #a0a0aa;
          --quiet: #777782;
        }
      }

      * { box-sizing: border-box; }
      html, body, #root { width: 100%; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 22% 24%, rgba(251, 113, 133, .08), transparent 34%),
          radial-gradient(circle at 80% 78%, rgba(45, 212, 191, .07), transparent 34%),
          var(--canvas);
        color: var(--ink-soft);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", system-ui, sans-serif;
        user-select: none;
      }
      button, input { font: inherit; }
      button, [role="button"] { -webkit-tap-highlight-color: transparent; }
      button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--teal) 72%, transparent);
        outline-offset: 2px;
      }
      .stage { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      .window {
        width: min(620px, calc(100vw - 32px));
        overflow: hidden;
        border: 1px solid color-mix(in srgb, white 48%, transparent);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 1px 0 rgba(255,255,255,.55) inset, 0 26px 72px rgba(0,0,0,.16);
        backdrop-filter: blur(38px) saturate(165%);
        transition: box-shadow 160ms var(--ease);
      }
      @media (prefers-color-scheme: dark) {
        .window { border-color: rgba(255,255,255,.1); box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 26px 72px rgba(0,0,0,.38); }
      }
      .titlebar {
        height: 44px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        padding-inline-start: 22px;
        border-bottom: 1px solid color-mix(in srgb, var(--line) 62%, transparent);
      }
      .titlebar strong { color: var(--ink); font: 600 15px/1.2 Georgia, "Noto Serif SC", serif; }
      .caption { height: 44px; display: grid; grid-template-columns: repeat(3, 46px); color: var(--muted); }
      .caption span { display: grid; place-items: center; font-size: 12px; }
      .caption span:last-child:hover { color: white; background: #c42b1c; }
      .body { padding: 22px 28px 24px; }
      .lede { margin: 0 0 18px; color: var(--muted); font-size: 12px; line-height: 1.55; }
      .field-label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11.5px; }
      .field-shell {
        height: 36px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 34px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--field);
        box-shadow: 0 1px 2px rgba(0,0,0,.02);
      }
      .field-shell input {
        min-width: 0;
        height: 26px;
        padding: 3px 0 3px 12px;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font-size: 12.5px;
        line-height: 20px;
        user-select: text;
      }
      .icon-button {
        width: 28px; height: 28px; display: grid; place-items: center;
        border: 0; border-radius: 7px; color: var(--muted); background: transparent; cursor: pointer;
      }
      .icon-button:hover { color: var(--ink-soft); background: var(--field-muted); }
      .preview {
        position: relative;
        height: 74px;
        margin-top: 15px;
        overflow: hidden;
        border-radius: 10px;
        background:
          radial-gradient(circle at 18% 20%, rgba(251,113,133,.42), transparent 42%),
          radial-gradient(circle at 82% 70%, rgba(45,212,191,.4), transparent 46%),
          linear-gradient(110deg, rgba(255,255,255,.62), rgba(167,139,250,.14));
        box-shadow: 0 1px 0 rgba(255,255,255,.48) inset;
      }
      .preview::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: .16; pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }
      .wave { position: absolute; inset: 0; display: flex; align-items: center; gap: 3px; padding: 18px; opacity: .62; }
      .wave i { width: 2px; height: var(--h); border-radius: 2px; background: color-mix(in srgb, var(--ink-soft) 66%, transparent); }
      .preview-copy { position: absolute; inset: 0 18px 0 auto; z-index: 1; display: grid; align-content: center; text-align: right; }
      .preview-copy strong { color: var(--ink); font-size: 12px; font-weight: 600; }
      .preview-copy span { margin-top: 2px; color: var(--ink-soft); font-size: 10.5px; }
      .section { margin-top: 18px; padding-top: 18px; border-top: 1px solid color-mix(in srgb, var(--line) 56%, transparent); }
      .settings-grid { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px 14px; align-items: center; }
      .settings-grid > label { color: var(--muted); font-size: 11.5px; }
      .segment { height: 32px; position: relative; display: grid; grid-template-columns: repeat(3, 1fr); padding: 2px; border-radius: 9px; background: var(--field-muted); }
      .segment::before {
        content: ""; position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 3);
        border-radius: 7px; background: var(--field); box-shadow: 0 1px 3px rgba(0,0,0,.06);
        transform: translateX(calc(var(--segment-index, 0) * 100%));
        transition: transform 240ms var(--ease);
      }
      .segment:has(button:focus-visible)::before { transition-duration: 0ms; }
      .segment button { position: relative; z-index: 1; border: 0; border-radius: 7px; color: var(--muted); background: transparent; font-size: 11.5px; cursor: pointer; }
      .segment button[aria-pressed="true"] { color: var(--ink); }
      .select-wrap { position: relative; }
      .select-trigger {
        width: 100%; height: 34px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center;
        gap: 12px; padding: 0 11px; border: 1px solid var(--line); border-radius: 9px;
        color: var(--ink-soft); background: var(--field); cursor: pointer; text-align: left; font-size: 12px;
      }
      .select-trigger span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .chevron { transition: transform 160ms var(--ease); }
      .select-wrap[data-open="true"] .chevron { transform: rotate(180deg); }
      .menu {
        position: absolute; z-index: 5; inset: calc(100% + 6px) 0 auto;
        display: grid; gap: 2px; padding: 6px; border: 1px solid var(--line); border-radius: 10px;
        background: color-mix(in srgb, var(--panel) 94%, white 6%); box-shadow: 0 14px 38px rgba(0,0,0,.16);
        backdrop-filter: blur(28px) saturate(150%);
        opacity: 0; transform: translateY(-4px) scale(.99); pointer-events: none;
        transition: opacity 180ms var(--ease), transform 220ms var(--ease);
      }
      .select-wrap[data-open="true"] .menu { opacity: 1; transform: none; pointer-events: auto; }
      .menu button { height: 29px; display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 0 8px; border: 0; border-radius: 7px; color: var(--ink-soft); background: transparent; text-align: left; font-size: 11.5px; cursor: pointer; }
      .menu button:hover, .menu button[aria-selected="true"] { background: var(--field-muted); }
      .menu em { color: var(--teal); font-style: normal; }
      .range-wrap { display: grid; grid-template-columns: 28px minmax(0,1fr) 40px; gap: 8px; align-items: center; }
      .range-wrap input { width: 100%; accent-color: var(--teal); user-select: auto; }
      .time { color: var(--quiet); font: 10.5px/1 ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; }
      .status-row { min-height: 34px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 12px; }
      .status { display: flex; align-items: center; gap: 9px; min-width: 0; color: var(--muted); font-size: 11.5px; }
      .state-swap { animation: state-enter 140ms var(--ease) both; }
      @keyframes state-enter { from { opacity: 0; } to { opacity: 1; } }
      .busy-dots { display: inline-flex; align-items: center; gap: 2px; }
      .busy-dots i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; animation: busy-enter 140ms var(--ease) both; }
      .busy-dots i:nth-child(2) { animation-delay: 40ms; }
      .busy-dots i:nth-child(3) { animation-delay: 80ms; }
      @keyframes busy-enter { from { opacity: .2; } to { opacity: .8; } }
      .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 12%, transparent); }
      .button {
        height: 32px; padding: 0 13px; border: 1px solid var(--line); border-radius: 9px;
        color: var(--ink-soft); background: var(--field); box-shadow: 0 1px 2px rgba(0,0,0,.025); cursor: pointer; font-size: 11.5px;
        transition: background 120ms ease, transform 100ms ease;
      }
      .button:hover { background: color-mix(in srgb, var(--field) 82%, var(--field-muted)); }
      .button:active { transform: scale(.98); }
      .button[disabled] { cursor: default; color: var(--quiet); opacity: .58; }
      .detail { display: grid; }
      .detail p { margin: 8px 0 0 14px; color: var(--quiet); font-size: 10.5px; line-height: 1.45; }
      .footer { margin-top: 18px; padding-top: 17px; border-top: 1px solid color-mix(in srgb, var(--line) 54%, transparent); display: flex; justify-content: space-between; align-items: center; }
      .footer small { color: var(--quiet); font-size: 10.5px; }
      @media (max-width: 560px) {
        .stage { padding: 12px; }
        .window { width: 100%; }
        .body { padding: 20px; }
        .settings-grid { grid-template-columns: 72px minmax(0,1fr); gap-inline: 10px; }
        .caption { grid-template-columns: repeat(3, 42px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .segment::before { transition-duration: 0ms; }
        .menu { transform: none; transition: opacity 80ms linear; }
        .state-swap, .busy-dots i { animation-duration: 0ms; animation-delay: 0ms; }
      }
    </style>
  </head>

              ),
              React.createElement("div", { className: "preview", "aria-label": "Static cleanup preview" },
                React.createElement("div", { className: "wave", "aria-hidden": true },
                  [12,20,31,18,42,27,48,22,35,15,28,44,20,34,16,38,25,46,29,18,33,24,41,21,30,15,36,26,44,19].map((h, i) => React.createElement("i", { key: i, style: { "--h": `${h}px` } }))

                React.createElement("div", { className: "segment", role: "group", "aria-label": "Cleanup strength", style: { "--segment-index": ["Light", "Balanced", "Strong"].indexOf(strength) } },

                ),
                ...(profileOptions.length > 1 ? [
                  React.createElement("label", { key: "profile-label" }, "Profile"),
                  React.createElement("div", { key: "profile-control", className: "select-wrap", ref: wrap, "data-open": open },
                    React.createElement("button", { className: "select-trigger", type: "button", "aria-haspopup": "listbox", "aria-expanded": open, onClick: () => setOpen(!open) },
                      React.createElement("span", null, profile), React.createElement("span", { className: "chevron", "aria-hidden": true }, "⌄")
                    ),
                    React.createElement("div", { className: "menu", role: "listbox" }, profileOptions.map(item =>
                      React.createElement("button", { key: item, type: "button", role: "option", "aria-selected": profile === item, onClick: () => { setProfile(item); setOpen(false); } },
                        React.createElement("span", null, item), profile === item ? React.createElement("em", null, "✓") : null
                      )
                    ))
                  ),
                ] : []),
                React.createElement("label", null, "Preview"),
                React.createElement("div", { className: "range-wrap" },
                  React.createElement("button", { className: "icon-button", type: "button", onClick: () => setPlaying(!playing), "aria-label": playing ? "Pause preview" : "Play preview" }, playing ? "Ⅱ" : "▶"),
                  React.createElement("input", { type: "range", min: 0, max: 100, defaultValue: 38, "aria-label": "Preview position" }),
                  React.createElement("span", { className: "time" }, "00:22")

              React.createElement("div", { className: "section" },
                React.createElement("div", { className: "status-row" },
                  React.createElement("div", { key: processing ? "processing" : "ready", className: "status state-swap" },

                    React.createElement("span", null, processing ? "Cleaning the recording" : "Ready on this device")

  </body>
