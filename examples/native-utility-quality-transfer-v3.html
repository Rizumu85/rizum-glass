<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizum Glass temporal-scope transfer test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <style>
      :root {
        color-scheme: light;
        --ink: #27272a;
        --soft: #52525b;
        --muted: #71717a;
        --caption: #a1a1aa;
        --line: #e4e4e7;
        --surface: rgba(255, 255, 255, 0.74);
        --surface-strong: rgba(255, 255, 255, 0.92);
        --surface-muted: rgba(244, 244, 245, 0.82);
        --teal: #2dd4bf;
        --shadow: 0 22px 60px rgba(39, 39, 42, 0.14), 0 2px 8px rgba(39, 39, 42, 0.08);
      }

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 20% 30%, rgba(167, 139, 250, 0.08) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 70%, rgba(129, 230, 217, 0.06) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 50%, rgba(251, 191, 36, 0.04) 0%, transparent 60%),
          #f0f0f0;
        font-family: Inter, "Segoe UI Variable Text", "Noto Sans SC", sans-serif;
      }

      button { font: inherit; }
      button:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--teal) 72%, white);
        outline-offset: 2px;
      }

      .glass {
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.82);
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.76);
        backdrop-filter: blur(28px) saturate(1.12);
      }

      .menu-enter {
        transform-origin: top right;
        animation: menu-enter 180ms cubic-bezier(.23, 1, .32, 1) both;
      }

      .mode-copy { animation: mode-copy 120ms ease-out both; }

      @keyframes menu-enter {
        from { opacity: 0; transform: translateY(-4px) scale(.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes mode-copy {
        from { opacity: .56; }
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-enter, .mode-copy { animation: none; }
      }
    </style>
  </head>
  <body>
    <main id="root" class="grid min-h-screen place-items-center p-8"></main>
    <script>
      const { useEffect, useRef, useState } = React;

      const modes = [
        { id: "hold", label: "Hold at end", short: "Hold", icon: "⇥" },
        { id: "next", label: "Play next take", short: "Next take", icon: "↦" },
        { id: "repeat", label: "Repeat this take", short: "Repeat", icon: "↻" },
      ];

      function EndModeMenu() {
        const [open, setOpen] = useState(new URLSearchParams(location.search).get("mode") === "open");
        const [selectedId, setSelectedId] = useState("hold");
        const wrap = useRef(null);
        const selected = modes.find((mode) => mode.id === selectedId);

        useEffect(() => {
          const close = (event) => {
            if (!wrap.current?.contains(event.target)) setOpen(false);
          };
          document.addEventListener("pointerdown", close);
          return () => document.removeEventListener("pointerdown", close);
        }, []);

        return React.createElement(
          "div",
          { className: "relative", ref: wrap, "data-role": "persistent-mode" },
          React.createElement(
            "button",
            {
              type: "button",
              className: "grid h-8 w-[148px] grid-cols-[16px_minmax(0,1fr)_12px] items-center gap-2 rounded-[9px] border border-zinc-200/80 bg-white/80 px-2.5 text-left text-[12px] text-zinc-700 shadow-[0_1px_3px_rgba(39,39,42,.08),inset_0_1px_0_rgba(255,255,255,.9)] transition hover:-translate-y-px hover:bg-white/95 active:translate-y-0",
              "aria-haspopup": "listbox",
              "aria-expanded": open,
              "aria-label": `End behavior: ${selected.label}`,
              onClick: () => setOpen((value) => !value),
              onKeyDown: (event) => {
                if (event.key === "Escape") setOpen(false);
              },
            },
            React.createElement("span", { className: "text-center text-[13px] text-zinc-500", "aria-hidden": true }, selected.icon),
            React.createElement("span", { className: "mode-copy truncate", key: selected.id }, `At end: ${selected.short}`),
            React.createElement("span", { className: `text-[10px] text-zinc-400 transition-transform ${open ? "rotate-180" : ""}`, "aria-hidden": true }, "⌄")
          ),
          open && React.createElement(
            "div",
            {
              className: "glass menu-enter absolute right-0 top-[38px] z-10 w-[188px] rounded-xl p-1.5",
              role: "listbox",
              "aria-label": "End behavior",
            },
            modes.map((mode) => React.createElement(
              "button",
              {
                key: mode.id,
                type: "button",
                role: "option",
                "aria-selected": selectedId === mode.id,
                className: "grid h-[31px] w-full grid-cols-[18px_minmax(0,1fr)_14px] items-center gap-2 rounded-[7px] px-2 text-left text-[12px] text-zinc-700 hover:bg-zinc-100/80",
                onClick: () => { setSelectedId(mode.id); setOpen(false); },
              },
              React.createElement("span", { className: "text-center text-[13px] text-zinc-500", "aria-hidden": true }, mode.icon),
              React.createElement("span", null, mode.label),
              React.createElement("span", { className: "text-teal-400", "aria-hidden": true }, selectedId === mode.id ? "✓" : "")
            ))
          )
        );
      }

      function App() {
        const [playing, setPlaying] = useState(false);

        return React.createElement(
          "section",
          { className: "glass w-[500px] rounded-[22px] px-6 pb-5 pt-5", "aria-labelledby": "surface-title" },
          React.createElement(
            "header",
            { className: "border-b border-zinc-200/60 pb-4" },
            React.createElement("p", { className: "mb-1 font-serif text-[11.5px] font-semibold text-zinc-500" }, "Audio cleanup"),
            React.createElement("h1", { id: "surface-title", className: "font-serif text-[19px] font-bold tracking-tight" }, "Review the clearer take"),
            React.createElement("p", { className: "mt-1 text-[12px] text-zinc-500" }, "Immediate transport and saved end behavior stay visually distinct.")
          ),
          React.createElement(
            "div",
            { className: "py-[18px]" },
            React.createElement("p", { className: "text-[13px] text-zinc-700" }, "Interview take 04 · cleaned"),
            React.createElement(
              "div",
              { className: "relative mt-4 h-5" },
              React.createElement("div", { className: "absolute left-0 right-0 top-[9px] h-0.5 rounded-full bg-zinc-200" }),
              React.createElement("div", { className: "absolute left-0 top-[9px] h-0.5 w-[38%] rounded-full bg-zinc-400" }),
              React.createElement("div", { className: "absolute left-[38%] top-1 h-3 w-3 -translate-x-1/2 rounded-full bg-zinc-400 shadow-[0_0_8px_2px_rgba(161,161,170,.2)]" })
            ),
            React.createElement(
              "div",
              { className: "mt-2 flex items-center gap-2" },
              React.createElement(
                "button",
                {
                  type: "button",
                  className: "grid h-8 w-8 shrink-0 place-items-center rounded-[9px] border border-white/80 bg-white/80 text-[12px] text-zinc-600 shadow-[0_1px_3px_rgba(39,39,42,.08),inset_0_1px_0_rgba(255,255,255,.9)] transition hover:-translate-y-px hover:bg-white/95 active:translate-y-0",
                  "data-role": "immediate-action",
                  "aria-label": playing ? "Pause preview" : "Play preview",
                  onClick: () => setPlaying((value) => !value),
                },
                playing ? "Ⅱ" : "▶"
              ),
              React.createElement("span", { className: "font-mono text-[11px] tabular-nums text-zinc-400" }, "01:18"),
              React.createElement("span", { className: "mr-auto text-[11px] text-zinc-300" }, "/ 03:26"),
              React.createElement(EndModeMenu)
            )
          ),
          React.createElement(
            "footer",
            { className: "flex items-center justify-between border-t border-zinc-200/60 pt-4 text-[11.5px] text-zinc-500" },
            React.createElement("span", { className: "inline-flex items-center gap-2" }, React.createElement("i", { className: "h-1.5 w-1.5 rounded-full bg-teal-400" }), "Ready for comparison"),
            React.createElement("span", null, "Modes persist until changed")
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
  </body>
</html>
